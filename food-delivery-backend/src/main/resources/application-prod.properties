# ==============================================================================
# Production Environment Configuration (Profile: prod)
# ==============================================================================

# Server Configuration
server.port=8084
management.server.port=8084

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://194.242.57.93:5004/fooddelivery04
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator & Prometheus Metrics Configuration (for Grafana / Prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Loki Logging Configuration
loki.url=http://194.242.57.93:3100/loki/api/v1/push

# Mailer / Portmailer SMTP Configuration
spring.mail.host=194.242.57.93
spring.mail.port=587
spring.mail.username=admin@fooddelivery.com
spring.mail.password=admin123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
